<div class="product-card glass-card h-100"
     [class.hovered]="isHovered"
     (mouseenter)="isHovered = true"
     (mouseleave)="isHovered = false">
  @if (isOnSale) {
  <div class="sale-badge">
    🔥 PROMO
  </div>
  }
  <div class="product-image-container">
    <img
      [src]="product.image"
      [alt]="product.title"
      class="product-image">
    <div class="product-overlay">
      <a [routerLink]="['/product', product.id]" class="btn btn-modern">
        👀 Ver Detalhes
      </a>
    </div>
  </div>
  <div class="card-body d-flex flex-column p-4">
    @if (showCategory) {
    <div class="product-category mb-3">
      <span class="badge bg-primary">{{ product.category | titlecase }}</span>
    </div>
    }
    <h5 class="product-title fw-bold mb-3">{{ product.title | truncate:60 }}</h5>
    <div class="product-rating mb-3">
      <div class="stars mb-1">
        @for (star of ratingStars; track $index) {
        <span class="text-warning">⭐</span>
        }
      </div>
      <small class="text-muted">({{ product.rating.count }} avaliações)</small>
    </div>
    <div class="product-price mt-auto">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong class="text-success fs-3">{{ product.price | currency:'BRL' }}</strong>
          @if (isOnSale) {
          <small class="text-danger ms-2 fw-bold">-30%</small>
          }
        </div>
      </div>
    </div>
  </div>
</div>
